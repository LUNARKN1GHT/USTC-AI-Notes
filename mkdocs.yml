site_name: 人工智能数学原理与算法 · 课程笔记
site_description: 从数学基础到机器学习、图神经网络、Transformer、自监督学习与强化学习的课程笔记
site_author: 李亦凡
site_url: https://lunarkn1ght.github.io/notes/USTC-AI-Notes/
repo_url: https://github.com/LUNARKN1GHT/USTC-AI-Notes
repo_name: LUNARKN1GHT/USTC-AI-Notes
edit_uri: edit/main/

docs_dir: .build/docs
use_directory_urls: true

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - 首页: index.md
  - 课程知识地图: 人工智能数学原理与算法A.md
  - 章节:
      - 数学基础: 00-数学基础/00-数学基础.md
      - 人工智能概述: 01-人工智能概述/01-人工智能概述.md
      - 机器学习基础: 02-机器学习基础/02-机器学习基础.md
      - 神经网络基础: 03-神经网络基础/03-神经网络基础.md
      - 图神经网络: 04-图神经网络/04-图神经网络.md
      - Transformer: 05-Transformer/05-Transformer.md
      - 自监督学习: 06-自监督学习/06-自监督学习.md
      - 强化学习: 07-强化学习/07-强化学习.md
  - 参与贡献: CONTRIBUTING.md
  - 署名与转载: ATTRIBUTION.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://lunarkn1ght.github.io/notes/
  social:
    - icon: fontawesome/solid/house
      link: https://lunarkn1ght.github.io/notes/
      name: 返回笔记总目录
    - icon: fontawesome/brands/github
      link: https://github.com/LUNARKN1GHT/USTC-AI-Notes
      name: GitHub 仓库

copyright: 内容采用 CC BY 4.0 许可协议
